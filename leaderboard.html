<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>StudyQuest — Online Leaderboard</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="premium.css"><link rel="stylesheet" href="background-music.css"><style>.leader-online-status{margin:14px 0;padding:10px 14px;border-radius:12px;background:rgba(255,255,255,.07);font-size:13px;opacity:.85}.leader-online-status.ok{box-shadow:0 0 0 1px rgba(0,220,180,.22)}.leader-actions{display:flex;gap:10px;align-items:center;margin:12px 0}.leader-actions button{cursor:pointer}</style><style>.leader-online-status{margin:14px 0;padding:10px 14px;border-radius:12px;background:rgba(255,255,255,.07);font-size:13px;opacity:.85}.leader-online-status.ok{box-shadow:0 0 0 1px rgba(0,220,180,.22)}.leader-actions{display:flex;gap:10px;align-items:center;margin:12px 0}.leader-actions button{cursor:pointer}.leader-player-id{display:block;margin-top:6px;padding:3px 8px;border:1px solid rgba(124,58,237,.45);border-radius:999px;background:rgba(124,58,237,.12);color:inherit;cursor:pointer;font-size:11px}.leader-player-id:hover{transform:translateY(-1px);box-shadow:0 0 14px rgba(124,58,237,.3)}.player-profile-modal{position:fixed;inset:0;display:none;align-items:center;justify-content:center;padding:20px;background:rgba(3,7,18,.72);backdrop-filter:blur(10px);z-index:9999}.player-profile-modal.show{display:flex}.player-profile-card{position:relative;width:min(520px,100%);padding:28px;border:1px solid rgba(255,255,255,.14);border-radius:24px;background:linear-gradient(145deg,rgba(20,25,48,.98),rgba(12,16,32,.98));box-shadow:0 24px 80px rgba(0,0,0,.5);animation:playerPop .22s ease-out}.player-profile-close{position:absolute;right:16px;top:12px;border:0;background:transparent;color:inherit;font-size:30px;cursor:pointer}.player-profile-id{margin:10px 0 20px;opacity:.75;font-size:12px;word-break:break-all}.player-profile-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.player-profile-stats div{padding:14px 10px;border-radius:16px;background:rgba(255,255,255,.06);text-align:center}.player-profile-stats small{display:block;opacity:.65;font-size:10px}.player-profile-stats strong{display:block;margin-top:5px;font-size:18px}.player-profile-card p{margin:18px 0 0;opacity:.7;font-size:12px}@keyframes playerPop{from{opacity:0;transform:scale(.94) translateY(12px)}to{opacity:1;transform:scale(1) translateY(0)}}@media(max-width:600px){.player-profile-stats{grid-template-columns:repeat(2,1fr)}} </style><link rel="stylesheet" href="navigation.css"></head><body data-back-fallback="home.html"><main class="leader-wrap"><div class="leader-card"><button class="ghost" onclick="location.href='index.html'">← Back to StudyQuest</button><div class="eyebrow" style="margin-top:28px">🏆 COMPETITIVE HUB</div><h1>Quest <span>Leaderboard</span></h1><p>See StudyQuest players' public game progress and climb the ranks.</p><div class="leader-online-status" id="onlineStatus">Connecting to online leaderboard…</div><div class="leader-actions"><button class="ghost" id="refreshLeaderboard">↻ Refresh</button></div><div class="leader-me"><div><small>YOUR RANK</small><b id="myRank">ROOKIE</b></div><div><small>MISSIONS</small><b id="myDone">0</b></div><div><small>XP</small><b id="myXp">0</b></div></div><div class="leader-list" id="leaderList"></div><div class="leader-note">💡 Click a player ID to open that student’s public leaderboard profile.</div></div></main><div class="player-profile-modal" id="playerProfileModal" role="dialog" aria-modal="true" aria-label="Player leaderboard profile"></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="online-leaderboard.js"></script><script src="background-music.js"></script><script src="navigation.js"></script></body></html>
