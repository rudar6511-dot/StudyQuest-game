<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>StudyQuest — Leaderboard</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="premium.css"></head><body><main class="leader-wrap"><div class="leader-card"><button class="ghost" onclick="location.href='index.html'">← Back to StudyQuest</button><div class="eyebrow" style="margin-top:28px">🏆 COMPETITIVE HUB</div><h1>Quest <span>Leaderboard</span></h1><p>Track your local StudyQuest progress and challenge yourself to climb the ranks.</p><div class="leader-me"><div><small>YOUR RANK</small><b id="myRank">ROOKIE</b></div><div><small>MISSIONS</small><b id="myDone">0</b></div><div><small>XP</small><b id="myXp">0</b></div></div><div class="leader-list" id="leaderList"></div><div class="leader-note">💡 This offline leaderboard uses progress stored in this browser. A true online leaderboard will require a shared database.</div></div></main><script>const get=k=>Number(localStorage.getItem(k)||0);const done=['math','science','english','hindi','ss'].reduce((n,s)=>n+Math.max(0,Math.min(20,get('sqProgress_'+s)-1)),0),xp=get('sqXp');const rank=n=>n>=50?'LEGEND':n>=30?'MASTER':n>=20?'CHAMPION':n>=10?'EXPLORER':n>=5?'RANGER':'ROOKIE';document.getElementById('myRank').textContent=rank(done);document.getElementById('myDone').textContent=done;document.getElementById('myXp').textContent=xp;const rows=[['🥇','Quest Champion',50,5000],['🥈','Science Master',40,4000],['🥉','Math Explorer',30,3000],['🚀','Your Quest',done,xp]];rows.sort((a,b)=>b[3]-a[3]);document.getElementById('leaderList').innerHTML=rows.map((r,i)=>`<div class="leader-row ${r[1]==='Your Quest'?'me':''}"><strong>${i+1}</strong><span>${r[0]}</span><div><b>${r[1]}</b><small>${r[2]} missions</small></div><em>${r[3]} XP</em></div>`).join('');</script></body></html>
