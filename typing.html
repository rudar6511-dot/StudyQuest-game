<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>StudyQuest — Typing Practice</title><link rel="stylesheet" href="style.css"><style>.typing-wrap{max-width:900px;margin:60px auto;padding:28px}.typing-card{background:#111528ee;border:1px solid #ffffff18;border-radius:28px;padding:32px;box-shadow:0 25px 80px #0007}.typing-text{font-size:24px;line-height:1.7;padding:22px;border-radius:18px;background:#ffffff08;margin:20px 0}.typing-input{width:100%;min-height:130px;resize:vertical;padding:18px;border-radius:16px;border:1px solid #ffffff20;background:#080b18;color:#fff;font-size:20px;outline:none}.typing-stats{display:flex;gap:14px;flex-wrap:wrap;margin:18px 0}.typing-stat{padding:12px 18px;border-radius:14px;background:#ffffff09}.typing-stat b{display:block;font-size:24px}.typing-stat small{color:#9da4bb}.typing-actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:18px}.ok{color:#55dda2}.bad{color:#ff7887}.typing-card a{color:inherit;text-decoration:none}</style></head><body><div class="typing-wrap"><div class="typing-card"><button class="ghost" onclick="location.href='index.html'">← Back to StudyQuest</button><div class="eyebrow" style="margin-top:24px">⌨️ SKILL LAB</div><h1>Typing <span>Practice</span></h1><p>Improve speed and accuracy while practicing educational sentences.</p><div class="typing-stats"><div class="typing-stat"><b id="wpm">0</b><small>WPM</small></div><div class="typing-stat"><b id="accuracy">100%</b><small>ACCURACY</small></div><div class="typing-stat"><b id="time">0s</b><small>TIME</small></div><div class="typing-stat"><b id="score">0</b><small>SCORE</small></div></div><div id="target" class="typing-text">The Earth moves around the Sun.</div><textarea id="input" class="typing-input" placeholder="Start typing the sentence here..." spellcheck="false" autocomplete="off"></textarea><div id="status"></div><div class="typing-actions"><button class="primary" onclick="newSentence()">New Sentence ↻</button><button class="ghost" onclick="resetPractice()">Reset</button></div></div></div><script>const sentences=['The Earth moves around the Sun.','Plants need sunlight, water and air to grow.','Practice makes learning faster and more confident.','Mathematics helps us understand patterns and numbers.','Reading every day can improve vocabulary and knowledge.','Good questions help students discover new ideas.','The water cycle includes evaporation and condensation.','India has many languages, cultures and traditions.','A balanced study routine includes breaks and practice.','Science helps us explore the world around us.'];let start=0,done=false;const $=x=>document.getElementById(x);function newSentence(){const s=sentences[Math.floor(Math.random()*sentences.length)];$('target').textContent=s;$('input').value='';$('status').textContent='';start=0;done=false;update()}function resetPractice(){newSentence()}function update(){const typed=$('input').value,target=$('target').textContent;if(!start&&typed.length)start=Date.now();let correct=0;for(let i=0;i<typed.length&&i<target.length;i++)if(typed[i]===target[i])correct++;const accuracy=typed.length?Math.round(correct/typed.length*100):100;const elapsed=start?Math.max(1,(Date.now()-start)/1000):0;const words=correct/5;const wpm=Math.round(words/(elapsed/60));$('accuracy').textContent=Math.max(0,accuracy)+'%';$('wpm').textContent=wpm;$('time').textContent=Math.floor(elapsed)+'s';$('score').textContent=Math.max(0,Math.round(wpm*accuracy/100*10));if(typed===target&&!done){done=true;$('status').innerHTML='<p class="ok">🎉 Excellent! Sentence completed accurately.</p>';localStorage.setItem('sqTypingBest',Math.max(+(localStorage.getItem('sqTypingBest')||0),wpm))}else if(typed.length>target.length){$('status').innerHTML='<p class="bad">Too many characters — check your typing.</p>'}else $('status').textContent=typed?`${correct}/${typed.length} characters correct`:'Start typing to begin the timer.'} $('input').addEventListener('input',update);setInterval(()=>{if(start&&!done)update()},500);newSentence();</script></body></html>
