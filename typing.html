<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>StudyQuest — Typing Levels</title><link rel="stylesheet" href="style.css"><style>.typing-wrap{max-width:1000px;margin:40px auto;padding:24px}.typing-card{background:#111528ee;border:1px solid #ffffff18;border-radius:28px;padding:30px;box-shadow:0 25px 80px #0007}.levels{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px;margin:24px 0}.tlevel{padding:20px;border:1px solid #ffffff15;border-radius:18px;background:#ffffff08;color:#fff;text-align:left;cursor:pointer;transition:.2s}.tlevel:hover{transform:translateY(-4px)}.tlevel.active{outline:2px solid #8b7cff}.tlevel b{display:block;font-size:18px}.tlevel small{display:block;color:#aab0c4;margin-top:6px}.typing-text{font-size:24px;line-height:1.7;padding:22px;border-radius:18px;background:#ffffff08;margin:20px 0}.typing-input{width:100%;min-height:130px;resize:vertical;padding:18px;border-radius:16px;border:1px solid #ffffff20;background:#080b18;color:#fff;font-size:20px;outline:none}.typing-stats{display:flex;gap:14px;flex-wrap:wrap;margin:18px 0}.typing-stat{padding:12px 18px;border-radius:14px;background:#ffffff09}.typing-stat b{display:block;font-size:24px}.typing-stat small{color:#9da4bb}.typing-actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:18px}.ok{color:#55dda2}.bad{color:#ff7887}</style></head><body><div class="typing-wrap"><div class="typing-card"><button class="ghost" onclick="location.href='index.html'">← Back to StudyQuest</button><div class="eyebrow" style="margin-top:24px">⌨️ SKILL LAB</div><h1>Typing <span>Academy</span></h1><p>Choose a level, type the sentence, and improve your speed and accuracy.</p><div id="levels" class="levels"></div><div class="typing-stats"><div class="typing-stat"><b id="wpm">0</b><small>WPM</small></div><div class="typing-stat"><b id="accuracy">100%</b><small>ACCURACY</small></div><div class="typing-stat"><b id="time">0s</b><small>TIME</small></div><div class="typing-stat"><b id="score">0</b><small>SCORE</small></div></div><div id="target" class="typing-text"></div><textarea id="input" class="typing-input" placeholder="Start typing here..." spellcheck="false" autocomplete="off"></textarea><div id="status"></div><div class="typing-actions"><button class="primary" onclick="newChallenge()">New Challenge ↻</button><button class="ghost" onclick="resetPractice()">Reset</button></div></div></div><script>const levels=[['Beginner','Short words','The sun is bright.','30'],['Starter','Easy sentences','I like to learn new things.','30'],['Explorer','School practice','Students read books every day.','35'],['Science','Science text','Plants need sunlight, water and air to grow.','40'],['Maths','Maths text','Mathematics helps us understand numbers and patterns.','40'],['English','English text','Reading improves vocabulary and communication skills.','45'],['Hindi','हिंदी अभ्यास','अच्छी आदतें हमें रोज़ बेहतर सीखने में मदद करती हैं।','35'],['Social Science','SS text','India has many cultures, languages and traditions.','45'],['Speed','Long sentence','Practice typing carefully first, then increase your speed.','50'],['Champion','Final challenge','Learning becomes exciting when practice turns into a daily quest.','55']];let selected=0,start=0,done=false;const $=x=>document.getElementById(x);function renderLevels(){levels.forEach((v,i)=>{const b=document.createElement('button');b.className='tlevel'+(i===selected?' active':'');b.innerHTML=`<b>Level ${i+1} — ${v[0]}</b><small>${v[1]} • Target ${v[3]} WPM</small>`;b.onclick=()=>{selected=i;document.querySelectorAll('.tlevel').forEach(x=>x.classList.remove('active'));b.classList.add('active');newChallenge()};$('levels').appendChild(b)})}function newChallenge(){const v=levels[selected];$('target').textContent=v[2];$('input').value='';$('status').textContent=`🎯 Target: ${v[3]} WPM`;start=0;done=false;update()}function resetPractice(){newChallenge()}function update(){const typed=$('input').value,target=$('target').textContent;if(!start&&typed.length)start=Date.now();let correct=0;for(let i=0;i<typed.length&&i<target.length;i++)if(typed[i]===target[i])correct++;const acc=typed.length?Math.round(correct/typed.length*100):100;const elapsed=start?Math.max(1,(Date.now()-start)/1000):0;const wpm=Math.round((correct/5)/(elapsed/60));$('accuracy').textContent=Math.max(0,acc)+'%';$('wpm').textContent=wpm;$('time').textContent=Math.floor(elapsed)+'s';$('score').textContent=Math.max(0,Math.round(wpm*acc/100*10));if(typed===target&&!done){done=true;const targetW=+levels[selected][3];$('status').innerHTML=wpm>=targetW?`<p class="ok">🏆 Level ${selected+1} complete! Target reached.</p>`:`<p class="bad">Sentence complete. Reach ${targetW} WPM to master this level.</p>`}else if(typed.length>target.length){$('status').innerHTML='<p class="bad">Too many characters — check your typing.</p>'}else if(typed.length){$('status').textContent=`${correct}/${typed.length} characters correct • Target ${levels[selected][3]} WPM`}}$('input').addEventListener('input',update);setInterval(()=>{if(start&&!done)update()},500);renderLevels();newChallenge();</script></body></html>
