<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>StudyQuest Live Multiplayer</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="multiplayer-online.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="multiplayer-online.js" defer></script></head><body><main class="live-multiplayer"><h1>🎮 StudyQuest Live</h1><p>Play and learn together with classmates in a live room.</p><section id="setup" class="live-grid"><div class="live-card"><h2>Create Room</h2><input id="newName" class="live-input" placeholder="Room name"><button class="live-btn" onclick="StudyQuestLive.create()">Create Live Room</button></div><div class="live-card"><h2>Join Room</h2><input id="joinCode" class="live-input" maxlength="6" placeholder="6-character room code"><button class="live-btn" onclick="StudyQuestLive.join(document.getElementById('joinCode').value)">Join Live Room</button></div></section><section id="liveLobby" class="live-card" hidden><span id="liveRoomStatus" class="live-status">WAITING FOR PLAYERS</span><h2>Room Code</h2><div id="liveRoomCode" class="live-code">—</div><button class="live-btn" onclick="navigator.clipboard?.writeText(document.getElementById('liveRoomCode').textContent)">Copy Code</button><button class="live-btn" onclick="StudyQuestLive.ready()">Ready / Not Ready</button><button class="live-btn" onclick="StudyQuestLive.start()">Start Match</button><button class="live-btn" onclick="StudyQuestLive.leave()">Leave</button><h2>Players</h2><div id="livePlayerList"></div><p class="live-note">Keep personal contact details private. Use the room only for learning.</p></section></main><script>window.addEventListener('DOMContentLoaded',()=>{const old=window.StudyQuestLive;const open=()=>document.getElementById('liveLobby').hidden=false;const originalCreate=old.create;const originalJoin=old.join;old.create=async()=>{await originalCreate();open()};old.join=async c=>{await originalJoin(c);if(window.sqRoom)open()};});</script></body></html>
