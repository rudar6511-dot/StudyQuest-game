<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>StudyQuest — Achievement Certificate</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="background-music.css"><style>body{display:grid;place-items:center;min-height:100vh;padding:25px}.cert{width:min(950px,100%);padding:55px;text-align:center;border:1px solid #ffffff18;border-radius:30px;background:linear-gradient(145deg,#15152c,#0b0d18);box-shadow:0 30px 100px #0008}.cert h1{font-size:clamp(42px,7vw,76px);margin:10px}.cert h1 span{color:#897aff}.cert h2{font-size:28px;margin:20px 0 8px}.cert p{color:#9da4bb;line-height:1.7}.medal{font-size:75px}.name{font-size:34px;font-weight:900;margin:25px 0}.stats{display:flex;justify-content:center;gap:14px;flex-wrap:wrap;margin:25px}.stat{padding:15px 25px;border:1px solid #ffffff12;border-radius:15px;background:#ffffff06}.stat b{display:block;font-size:24px}.stat small{color:#858ba5}.actions{display:flex;justify-content:center;gap:12px;flex-wrap:wrap}@media print{body{background:white;color:#111}.cert{box-shadow:none;border:3px solid #111}.actions{display:none}.cert p{color:#333}}</style></head><body><main class="cert"><div class="medal">🏆</div><div class="eyebrow">STUDYQUEST ACHIEVEMENT</div><h1>Quest <span>Certificate</span></h1><p>This certificate recognizes a learner's progress, consistency and achievements in the StudyQuest learning adventure.</p><div class="name" id="student">StudyQuest Explorer</div><div class="stats"><div class="stat"><b id="xp">0</b><small>TOTAL XP</small></div><div class="stat"><b id="done">0</b><small>MISSIONS</small></div><div class="stat"><b id="streak">0</b><small>DAY STREAK</small></div></div><p id="rank">Rookie Explorer</p><div class="actions"><button class="primary" onclick="window.print()">🖨 Print Certificate</button><button class="ghost" onclick="location.href='index.html'">← Back to StudyQuest</button></div></main><script>const g=k=>Number(localStorage.getItem(k)||0);document.getElementById('xp').textContent=g('sqXp');document.getElementById('done').textContent=['math','science','english','hindi','ss'].reduce((n,s)=>n+Math.max(0,Math.min(20,g('sqProgress_'+s,1)-1)),0);document.getElementById('streak').textContent=g('sqStreak');const n=+document.getElementById('done').textContent;document.getElementById('rank').textContent=n>=50?'LEGEND • Elite Learner':n>=30?'MASTER • Advanced Learner':n>=20?'CHAMPION • Quest Leader':n>=10?'EXPLORER • Rising Learner':'ROOKIE • Keep Questing';const p=localStorage.getItem('sqStudentProfile');if(p)try{const x=JSON.parse(p);if(x.name)document.getElementById('student').textContent=x.name}catch(e){}</script><script src="background-music.js"></script></body></html>
