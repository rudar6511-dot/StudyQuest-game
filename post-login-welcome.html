<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Welcome to StudyQuest</title><link rel="stylesheet" href="welcome.css"><style>.welcome-card{max-width:650px;text-align:center}.ai{font-size:86px;animation:float 2.8s ease-in-out infinite;filter:drop-shadow(0 0 25px #7565ff66)}.hello{font-size:12px;letter-spacing:2px;color:#9588ff;font-weight:900;margin-top:8px}.name{font-size:40px;margin:8px 0}.name span{color:#8575ff}.welcome-text{color:#9ba1b6;line-height:1.6}.continue{display:inline-block;margin-top:20px;text-decoration:none;border-radius:14px;padding:14px 28px;background:linear-gradient(135deg,#7565ff,#a16cff);color:#fff;font-weight:900;box-shadow:0 12px 30px #765cff44;transition:.25s}.continue:hover{transform:translateY(-3px)}.profile-chip{margin-top:18px;color:#687088;font-size:11px}</style></head><body><div class="welcome-bg"></div><main class="welcome-card"><div class="logo">🚀 Study<span>Quest</span></div><div class="ai">🤖</div><div class="hello">AI QUEST GUIDE • ONLINE</div><h1 class="name">Welcome, <span id="student">Student</span>! 👋</h1><p class="welcome-text">Your learning adventure is ready. Explore worlds, complete missions, earn XP and level up your knowledge.</p><a class="continue" href="home.html">ENTER STUDYQUEST 🚀</a><div class="profile-chip" id="profile"></div></main><script>(function(){try{var p=JSON.parse(localStorage.getItem('sqStudentProfile')||'{}');if(!p.id){location.replace('welcome.html');return}document.getElementById('student').textContent=p.name||p.id;document.getElementById('profile').textContent='Quest ID: '+p.id+' • Your progress is saved on this device.'}catch(e){location.replace('welcome.html')}})();</script></body></html>
