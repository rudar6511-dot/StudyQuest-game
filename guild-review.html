<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#10152e"><title>Review Guild Application — StudyQuest</title><link rel="stylesheet" href="guild.css"><script src="guild-config.js"></script></head>
<body><header><a class="brand" href="guild.html">⚔️ StudyQuest Guilds</a></header><main><section class="hero"><h1>Guild Application <span>Review</span></h1><p>This page confirms the one-time decision link from the guild admin's email.</p></section><section class="panel"><div id="reviewNotice" class="notice">Checking your secure review link…</div><p id="reviewDetail"></p><a id="backLink" href="guild.html" style="display:none">Return to Guild Hall</a></section></main>
<script>
(async()=>{
 const notice=document.getElementById('reviewNotice'),detail=document.getElementById('reviewDetail');
 const params=new URLSearchParams(location.search),token=params.get('token');
 if(!token){notice.className='notice error';notice.textContent='Missing review token. Open the Accept/Reject link from the guild admin email.';return;}
 notice.textContent='Processing your one-time decision…';
 try{
  const response=await fetch('https://cfoyqyplnmxsxyxyfdbb.supabase.co/functions/v1/guild-email',{
   method:'POST',headers:{'Content-Type':'application/json','apikey':window.SQ_GUILD_SUPABASE_ANON_KEY||''},
   body:JSON.stringify({action:'reviewEmailToken',token})
  });
  const result=await response.json();
  if(!response.ok)throw new Error(result.error||'The review link could not be processed.');
  notice.className='notice success';notice.textContent=result.message||'Decision saved.';
  detail.textContent='You can close this page or return to the Guild Hall.';
  document.getElementById('backLink').style.display='inline-block';
 }catch(e){notice.className='notice error';notice.textContent=e.message||'Review failed. Please contact the StudyQuest administrator.';}
})();
</script></body></html>
