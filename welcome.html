<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>StudyQuest — Login / Sign Up</title><link rel="stylesheet" href="welcome.css"></head><body><div class="welcome-bg"></div><main class="welcome-card"><div class="logo">🚀 Study<span>Quest</span></div><div class="rocket">🎓</div><div class="eyebrow">YOUR LEARNING ACCOUNT</div><h1 id="title">Login to <span>StudyQuest</span></h1><p class="intro" id="intro">Login with your Quest ID and password to continue your progress.</p><div class="tabs"><button type="button" id="loginTab" class="tab active">Login</button><button type="button" id="signupTab" class="tab">Create Account</button></div><form id="authForm" class="form"><div id="signupFields" hidden><label>Student Name<input id="studentName" maxlength="50" autocomplete="name" placeholder="Enter your name"></label><label>School Name<input id="schoolName" maxlength="100" placeholder="Enter your school name"></label><label>City / Address<input id="address" maxlength="200" placeholder="Optional"></label></div><label>Quest ID<input id="questId" required maxlength="30" pattern="[A-Za-z0-9_@.-]+" autocomplete="username" placeholder="e.g. student_123"></label><label>Password<input id="password" type="password" required minlength="6" maxlength="80" autocomplete="current-password" placeholder="At least 6 characters"></label><button class="submit" id="submitBtn" type="submit">LOGIN & ENTER 🚀</button></form><p id="message" class="note"></p><div class="note">Create your Quest Account first. Then use the same Quest ID and password to login.</div></main><script>(function(){var mode='login', $=function(id){return document.getElementById(id)};function setMode(m){mode=m;var s=m==='signup';$('signupFields').hidden=!s;$('title').innerHTML=s?'Create Your <span>Quest Account</span>':'Login to <span>StudyQuest</span>';$('intro').textContent=s?'Fill your details below and create your student account.':'Login with your Quest ID and password to continue your progress.';$('submitBtn').textContent=s?'CREATE ACCOUNT 🚀':'LOGIN & ENTER 🚀';$('loginTab').classList.toggle('active',!s);$('signupTab').classList.toggle('active',s);$('password').autocomplete=s?'new-password':'current-password';$('message').textContent=''}$('loginTab').onclick=function(){setMode('login')};$('signupTab').onclick=function(){setMode('signup')};$('authForm').onsubmit=function(e){e.preventDefault();var id=$('questId').value.trim(),pw=$('password').value,pkey='sqAccount_'+id.toLowerCase();if(!id||!pw){$('message').textContent='Please enter Quest ID and password.';return}if(mode==='signup'){if(!$('studentName').value.trim()||!$('schoolName').value.trim()){$('message').textContent='Please enter Student Name and School Name.';return}if(pw.length<6){$('message').textContent='Password must be at least 6 characters.';return}if(localStorage.getItem(pkey)){$('message').textContent='This Quest ID already exists. Please login.';return}var a={id:id,name:$('studentName').value.trim(),school:$('schoolName').value.trim(),address:$('address').value.trim(),password:pw};localStorage.setItem(pkey,JSON.stringify(a));localStorage.setItem('sqStudentProfile',JSON.stringify({id:a.id,name:a.name,school:a.school,address:a.address}));localStorage.setItem('sqOnboarded','1');window.location.href='./index.html';return}var raw=localStorage.getItem(pkey);if(!raw){$('message').textContent='Quest ID not found. Click Create Account first.';return}try{var a2=JSON.parse(raw);if(a2.password!==pw){$('message').textContent='Incorrect password. Please try again.';return}localStorage.setItem('sqStudentProfile',JSON.stringify({id:a2.id,name:a2.name,school:a2.school,address:a2.address}));localStorage.setItem('sqOnboarded','1');window.location.href='./index.html'}catch(err){$('message').textContent='Could not read this account. Please create it again.'}}})();</script></body></html>
