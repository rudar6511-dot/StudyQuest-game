<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>StudyQuest — Student Profile</title><link rel="stylesheet" href="welcome.css"></head><body><div class="welcome-bg"></div><div class="welcome-card"><div class="logo">🚀 Study<span>Quest</span></div><div class="rocket">🧑‍🚀</div><div class="eyebrow">WELCOME, LEARNER</div><h1>Create Your <span>Quest ID</span></h1><p class="intro">Set up your student profile before entering the learning world.</p><form class="form" id="profileForm"><label>Student Name<input id="studentName" required maxlength="50" autocomplete="name" placeholder="Enter your name"></label><label>Quest ID<input id="questId" required maxlength="30" pattern="[A-Za-z0-9_-]+" placeholder="Choose a unique ID"></label><label>School Name<input id="schoolName" required maxlength="100" placeholder="Enter your school name"></label><label>Address<input id="address" required maxlength="200" placeholder="Enter your city / address"></label><button class="submit" type="submit">Enter StudyQuest 🚀</button></form><div class="note">Your profile is saved only in this browser for now.</div></div><script>document.getElementById('profileForm').addEventListener('submit',e=>{e.preventDefault();const p={name:studentName.value.trim(),id:questId.value.trim(),school:schoolName.value.trim(),address:address.value.trim()};localStorage.setItem('sqStudentProfile',JSON.stringify(p));localStorage.setItem('sqOnboarded','1');location.href='index.html'});</script></body></html>
