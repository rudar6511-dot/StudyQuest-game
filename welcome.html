<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>StudyQuest — Login / Sign Up</title><link rel="stylesheet" href="welcome.css"></head><body><div class="welcome-bg"></div><main class="welcome-card"><div class="logo">🚀 Study<span>Quest</span></div><div class="rocket">🎓</div><div class="eyebrow">YOUR LEARNING ACCOUNT</div><h1 id="title">Login to <span>StudyQuest</span></h1><p class="intro" id="intro">Login with your Quest ID and password to continue your progress.</p><div class="tabs"><button id="loginTab" class="tab active">Login</button><button id="signupTab" class="tab">Create Account</button></div><form id="authForm" class="form"><div id="signupFields" hidden><label>Student Name<input id="studentName" maxlength="50" autocomplete="name" placeholder="Enter your name"></label><label>School Name<input id="schoolName" maxlength="100" placeholder="Enter your school name"></label></div><label>Quest ID<input id="questId" required maxlength="30" pattern="[A-Za-z0-9_-]+" autocomplete="username" placeholder="e.g. student_123"></label><label>Password<input id="password" type="password" required minlength="6" maxlength="80" autocomplete="current-password" placeholder="At least 6 characters"></label><label id="addressWrap" hidden>City / Address<input id="address" maxlength="200" placeholder="Optional"></label><button class="submit" id="submitBtn" type="submit">Login & Enter 🚀</button></form><p id="message" class="note"></p><div class="note">Your account is stored in this browser. Never use a password you use for another account.</div></main><script>let mode='login';const $=id=>document.getElementById(id),tabs=[$('loginTab'),$('signupTab')];function setMode(m){mode=m;const signup=m==='signup';$('signupFields').hidden=!signup;$('addressWrap').hidden=!signup;$('title').innerHTML=signup?'Create Your <span>Quest Account</span>':'Login to <span>StudyQuest</span>';$('intro').textContent=signup?'Create your student account, then use the same Quest ID and password to login.':'Login with your Quest ID and password to continue your progress.';$('submitBtn').textContent=signup?'Create Account 🚀':'Login & Enter 🚀';tabs.forEach((b,i)=>b.classList.toggle('active',signup?i===1:i===0));$('password').autocomplete=signup?'new-password':'current-password';$('message').textContent=''}$('loginTab').onclick=()=>setMode('login');$('signupTab').onclick=()=>setMode('signup');$('authForm').addEventListener('submit',e=>{e.preventDefault();const id=$('questId').value.trim(),pw=$('password').value,pkey='sqAccount_'+id.toLowerCase();if(mode==='signup'){if(pw.length<6)return $('message').textContent='Password must be at least 6 characters.';if(localStorage.getItem(pkey))return $('message').textContent='This Quest ID already exists. Please login.';const account={id,name:$('studentName').value.trim(),school:$('schoolName').value.trim(),address:$('address').value.trim(),password:pw};localStorage.setItem(pkey,JSON.stringify(account));localStorage.setItem('sqStudentProfile',JSON.stringify({id:account.id,name:account.name,school:account.school,address:account.address}));localStorage.setItem('sqOnboarded','1');location.href='index.html'}else{const raw=localStorage.getItem(pkey);if(!raw)return $('message').textContent='Quest ID not found. Create an account first.';const a=JSON.parse(raw);if(a.password!==pw)return $('message').textContent='Incorrect password. Please try again.';localStorage.setItem('sqStudentProfile',JSON.stringify({id:a.id,name:a.name,school:a.school,address:a.address}));localStorage.setItem('sqOnboarded','1');location.href='index.html'}});</script></body></html>
